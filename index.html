<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Rock&#129704; - Paper&#128196;-Scissors&#9986;</h1>
    </header>

    <div class="options">
        <div class="option" id="rock"><img src="rock.png"></div>
        <div class="option" id="paper"><img src="paper.png"></div>
        <div class="option" id="scissors"><img src="scissors.png"></div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msgBox">
        <p id="msg">Play your move</p>
    </div>



    <script src="script.js"></script>
</body>

</html>
